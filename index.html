<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מגרשי ספורט ניר אליהו</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2873/2873133.png">

    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Rubik', sans-serif;
            background-color: #f8fafc;
        }
        .court-bg-tennis {
            background-color: #3b82f6;
        }
        .court-bg-futsal {
            background-color: #22c55e;
        }
        .court-bg-both {
            background: linear-gradient(135deg, #3b82f6 50%, #22c55e 50%);
        }
    </style>
</head>
<body class="text-slate-800 pb-12">

    <div class="max-w-xl mx-auto px-4 py-6 space-y-6">

        <!-- Header -->
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold text-slate-900 flex items-center justify-center gap-2">
                <span>🏟️</span> מגרשי ספורט ניר אליהו
            </h1>
            <p class="text-xs text-slate-500">בחרו יום ולחצו "צור הזמנה" להזמנת מגרש</p>
            
            <!-- מקרא -->
            <div class="flex items-center justify-center gap-4 text-xs pt-1">
                <span class="flex items-center gap-1.5">
                    <span class="w-3 h-3 rounded-full bg-blue-500 inline-block"></span>
                    טניס 🎾
                </span>
                <span class="flex items-center gap-1.5">
                    <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
                    קטרגל ⚽
                </span>
            </div>
        </div>

        <!-- לוח שנה -->
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200/80 space-y-4">
            
            <!-- מעבר חודשים -->
            <div class="flex items-center justify-between px-2">
                <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 rounded-full transition-colors text-slate-600">
                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>
                <h2 id="calendar-month-title" class="text-lg font-bold text-slate-800">-- 2026</h2>
                <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-100 rounded-full transition-colors text-slate-600">
                    <i data-lucide="chevron-left" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- ימי השבוע -->
            <div class="grid grid-cols-7 text-center text-xs font-semibold text-slate-400 py-1">
                <div>א'</div><div>ב'</div><div>ג'</div><div>ה'</div><div>ו'</div><div>ש'</div>
            </div>

            <!-- גריד הימים -->
            <div id="calendar-days-grid" class="grid grid-cols-7 gap-2">
                <!-- מיוצר דינמית -->
            </div>
        </div>

        <!-- אזור הזמנות ליום שנבחר -->
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200/80 space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 id="selected-day-title" class="text-base font-bold text-slate-800">היום</h3>
            </div>

            <div id="bookings-list" class="space-y-3">
                <div class="text-center py-6 text-slate-400 text-sm">טוען הזמנות...</div>
            </div>

            <button onclick="openBookingModal()" class="w-full bg-amber-500 hover:bg-amber-600 active:scale-[0.98] text-white py-3.5 rounded-2xl font-bold text-base shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2 transition-all">
                <i data-lucide="plus" class="w-5 h-5"></i>
                צור הזמנה
            </button>
        </div>

    </div>

    <!-- Modal הזמנה (יצירה / עריכה) -->
    <div id="booking-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-5 relative animate-in fade-in zoom-in-95 duration-150">
            
            <button onclick="closeBookingModal()" class="absolute top-5 left-5 text-slate-400 hover:text-slate-600">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <h3 id="modal-date-title" class="text-lg font-bold text-slate-900 pr-2">הזמנת מגרש</h3>

            <form onsubmit="submitBooking(event)" class="space-y-4">
                
                <input type="hidden" id="editing-booking-id" value="">

                <!-- בחירת סוג מגרש -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-2">סוג מגרש</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" id="btn-court-tennis" onclick="selectCourt('tennis')" 
                            class="py-3 px-4 rounded-2xl border-2 font-bold text-sm flex items-center justify-center gap-2 transition-all border-blue-500 bg-blue-50 text-blue-700">
                            <span>🎾</span> טניס
                        </button>
                        <button type="button" id="btn-court-futsal" onclick="selectCourt('futsal')" 
                            class="py-3 px-4 rounded-2xl border-2 font-bold text-sm flex items-center justify-center gap-2 transition-all border-slate-200 bg-slate-50 text-slate-600">
                            <span>⚽</span> קטרגל
                        </button>
                    </div>
                </div>

                <!-- שעת התחלה ומשך זמן -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">שעת התחלה</label>
                        <select id="booking-start-time" class="w-full px-4 py-3 rounded-2xl border border-slate-200 text-sm font-medium bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <!-- שעות מ-06:00 עד 22:00 -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">משך זמן</label>
                        <select id="booking-duration" class="w-full px-4 py-3 rounded-2xl border border-slate-200 text-sm font-medium bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="60">שעה</option>
                            <option value="90">שעה וחצי</option>
                            <option value="120">שעתיים</option>
                        </select>
                    </div>
                </div>

                <!-- שם המזמין -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">שם המזמין</label>
                    <input type="text" id="booking-booker-name" placeholder="הכניסו את שמכם" required
                        class="w-full px-4 py-3 rounded-2xl border border-slate-200 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- כולל הרשמת משתתפים -->
                <div class="flex items-center justify-between p-3.5 bg-slate-50 border border-slate-200/80 rounded-2xl">
                    <span class="text-sm font-medium text-slate-700 flex items-center gap-2">
                        <i data-lucide="users" class="w-4 h-4 text-slate-500"></i>
                        כולל הרשמת משתתפים
                    </span>
                    <input type="checkbox" id="booking-enable-reg" class="w-5 h-5 rounded border-slate-300 text-amber-500 focus:ring-amber-500">
                </div>

                <button type="submit" id="modal-submit-btn" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-amber-500/20 transition-all text-base">
                    אישור הזמנה
                </button>
            </form>
        </div>
    </div>

    <!-- Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
      }
    </script>

    <!-- Logic -->
    <script>
        const SUPABASE_BASE_URL = 'https://pjujibzoscawmstarerz.supabase.co/rest/v1';
        const SUPABASE_KEY = 'sb_publishable_5mK3Md5VCpXjHTSgVv68GQ_8kmPbg83';

        const apiHeaders = {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
        };

        const monthNames = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני", "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"];
        const dayNames = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"];

        let currentDate = new Date();
        let selectedDateStr = new Date().toISOString().split('T')[0];
        let selectedCourtType = 'tennis';

        let allBookings = [];
        let allParticipants = [];

        document.addEventListener('DOMContentLoaded', () => {
            populateTimeOptions();
            lucide.createIcons();
            fetchBookings();
        });

        function populateTimeOptions() {
            const select = document.getElementById('booking-start-time');
            select.innerHTML = '';
            for (let h = 6; h <= 22; h++) {
                for (let m = 0; m < 60; m += 30) {
                    if (h === 22 && m > 0) break;
                    const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
                    select.innerHTML += `<option value="${timeStr}">${timeStr}</option>`;
                }
            }
        }

        async function fetchBookings() {
            try {
                const resB = await fetch(`${SUPABASE_BASE_URL}/court_bookings?select=*`, { headers: apiHeaders });
                if (resB.ok) allBookings = await resB.json();

                const resP = await fetch(`${SUPABASE_BASE_URL}/booking_participants?select=*`, { headers: apiHeaders });
                if (resP.ok) allParticipants = await resP.json();
            } catch (e) {}

            renderCalendar();
            renderSelectedDayBookings();
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('calendar-month-title').textContent = `${monthNames[month]} ${year}`;

            const firstDayOfMonth = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const grid = document.getElementById('calendar-days-grid');
            grid.innerHTML = '';

            for (let i = 0; i < firstDayOfMonth; i++) {
                grid.innerHTML += `<div></div>`;
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const monthStr = String(month + 1).padStart(2, '0');
                const dayStr = String(day).padStart(2, '0');
                const dateKey = `${year}-${monthStr}-${dayStr}`;

                const dayBookings = allBookings.filter(b => b.date === dateKey);
                const hasTennis = dayBookings.some(b => b.court_type === 'tennis');
                const hasFutsal = dayBookings.some(b => b.court_type === 'futsal');

                let bgClass = 'bg-slate-100 text-slate-700';
                if (hasTennis && hasFutsal) bgClass = 'court-bg-both text-white';
                else if (hasTennis) bgClass = 'bg-blue-500 text-white';
                else if (hasFutsal) bgClass = 'bg-emerald-500 text-white';

                const isSelected = dateKey === selectedDateStr ? 'ring-4 ring-blue-600/30 font-bold scale-105' : '';

                grid.innerHTML += `
                    <button onclick="selectDate('${dateKey}')" 
                        class="h-11 rounded-2xl text-sm font-semibold flex flex-col items-center justify-center transition-all ${bgClass} ${isSelected}">
                        <span>${day}</span>
                        ${dayBookings.length > 0 ? `<span class="text-[9px] opacity-80 font-normal">≡</span>` : ''}
                    </button>
                `;
            }

            lucide.createIcons();
        }

        function selectDate(dateKey) {
            selectedDateStr = dateKey;
            renderCalendar();
            renderSelectedDayBookings();
        }

        function renderSelectedDayBookings() {
            const d = new Date(selectedDateStr + 'T00:00:00');
            const dayTitle = `היום יום ${dayNames[d.getDay()]} ${d.getDate()}/${d.getMonth() + 1}`;
            document.getElementById('selected-day-title').textContent = dayTitle;

            const listEl = document.getElementById('bookings-list');
            const dayBookings = allBookings.filter(b => b.date === selectedDateStr)
                                           .sort((a,b) => a.start_time.localeCompare(b.start_time));

            if (dayBookings.length === 0) {
                listEl.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">אין הזמנות ליום זה</div>`;
                return;
            }

            listEl.innerHTML = dayBookings.map(b => {
                const parts = allParticipants.filter(p => p.booking_id === b.id);
                
                const [h, m] = b.start_time.split(':').map(Number);
                const endD = new Date(2000, 0, 1, h, m + b.duration_minutes);
                const endTimeStr = `${String(endD.getHours()).padStart(2,'0')}:${String(endD.getMinutes()).padStart(2,'0')}`;

                const badgeBg = b.court_type === 'tennis' ? 'bg-blue-600' : 'bg-emerald-600';

                return `
                    <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-4 space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-sm font-bold text-slate-800">${b.booker_name}</span>
                            <span class="${badgeBg} text-white px-3 py-1 rounded-xl text-xs font-bold shadow-sm">
                                ${b.start_time} – ${endTimeStr}
                            </span>
                        </div>

                        <div class="flex items-center justify-between pt-1">
                            <div>
                                ${b.enable_registration ? `
                                    <div class="flex items-center gap-2">
                                        <button onclick="addParticipantPrompt(${b.id})" class="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold px-3 py-1.5 rounded-xl shadow-sm">
                                            הרשמה
                                        </button>
                                        <span class="text-xs font-semibold text-amber-700 bg-amber-50 border border-amber-200 px-2.5 py-1 rounded-xl">
                                            🎟️ כולל הרשמה ${parts.length}/${b.max_participants || 6}
                                        </span>
                                    </div>
                                ` : ''}
                            </div>

                            <div class="flex items-center gap-1.5 text-slate-400">
                                <button onclick="editBooking(${b.id})" class="p-1.5 hover:bg-slate-200/60 rounded-xl transition-colors text-slate-500" title="ערוך הזמנה">
                                    <i data-lucide="pencil" class="w-4 h-4"></i>
                                </button>
                                <button onclick="deleteBooking(${b.id})" class="p-1.5 hover:bg-red-100 rounded-xl transition-colors text-red-500" title="מחק הזמנה">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>

                        ${b.enable_registration && parts.length > 0 ? `
                            <div class="flex flex-wrap gap-1.5 pt-1">
                                ${parts.map(p => `
                                    <span class="bg-white border border-slate-200 text-slate-600 text-xs px-2.5 py-0.5 rounded-lg">
                                        ${p.participant_name}
                                    </span>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        function selectCourt(type) {
            selectedCourtType = type;
            const btnTennis = document.getElementById('btn-court-tennis');
            const btnFutsal = document.getElementById('btn-court-futsal');

            if (type === 'tennis') {
                btnTennis.className = "py-3 px-4 rounded-2xl border-2 font-bold text-sm flex items-center justify-center gap-2 transition-all border-blue-500 bg-blue-50 text-blue-700";
                btnFutsal.className = "py-3 px-4 rounded-2xl border-2 font-bold text-sm flex items-center justify-center gap-2 transition-all border-slate-200 bg-slate-50 text-slate-600";
            } else {
                btnFutsal.className = "py-3 px-4 rounded-2xl border-2 font-bold text-sm flex items-center justify-center gap-2 transition-all border-emerald-500 bg-emerald-50 text-emerald-700";
                btnTennis.className = "py-3 px-4 rounded-2xl border-2 font-bold text-sm flex items-center justify-center gap-2 transition-all border-slate-200 bg-slate-50 text-slate-600";
            }
        }

        function openBookingModal() {
            document.getElementById('editing-booking-id').value = '';
            document.getElementById('booking-booker-name').value = '';
            document.getElementById('booking-enable-reg').checked = false;
            document.getElementById('booking-start-time').selectedIndex = 0;
            document.getElementById('booking-duration').value = '60';
            selectCourt('tennis');

            document.getElementById('modal-submit-btn').textContent = 'אישור הזמנה';

            const d = new Date(selectedDateStr + 'T00:00:00');
            document.getElementById('modal-date-title').textContent = `הזמנת מגרש — יום ${dayNames[d.getDay()]}, ${d.getDate()} ב${monthNames[d.getMonth()]}`;
            document.getElementById('booking-modal').classList.remove('hidden');
        }

        function editBooking(id) {
            const b = allBookings.find(item => item.id === id);
            if (!b) return;

            document.getElementById('editing-booking-id').value = b.id;
            document.getElementById('booking-booker-name').value = b.booker_name;
            document.getElementById('booking-start-time').value = b.start_time;
            document.getElementById('booking-duration').value = b.duration_minutes.toString();
            document.getElementById('booking-enable-reg').checked = b.enable_registration;
            selectCourt(b.court_type);

            document.getElementById('modal-submit-btn').textContent = 'עדכון הזמנה';

            const d = new Date(selectedDateStr + 'T00:00:00');
            document.getElementById('modal-date-title').textContent = `עריכת הזמנה — יום ${dayNames[d.getDay()]}, ${d.getDate()} ב${monthNames[d.getMonth()]}`;
            document.getElementById('booking-modal').classList.remove('hidden');
        }

        function closeBookingModal() {
            document.getElementById('booking-modal').classList.add('hidden');
        }

        async function submitBooking(e) {
            e.preventDefault();
            const bookingId = document.getElementById('editing-booking-id').value;
            const startTime = document.getElementById('booking-start-time').value;
            const duration = parseInt(document.getElementById('booking-duration').value);
            const bookerName = document.getElementById('booking-booker-name').value.trim();
            const enableReg = document.getElementById('booking-enable-reg').checked;

            if (!bookerName) return;

            const bookingData = {
                date: selectedDateStr,
                court_type: selectedCourtType,
                start_time: startTime,
                duration_minutes: duration,
                booker_name: bookerName,
                enable_registration: enableReg
            };

            closeBookingModal();

            try {
                if (bookingId) {
                    // עדכון הזמנה קיימת
                    const res = await fetch(`${SUPABASE_BASE_URL}/court_bookings?id=eq.${bookingId}`, {
                        method: 'PATCH',
                        headers: apiHeaders,
                        body: JSON.stringify(bookingData)
                    });
                    if (res.ok) fetchBookings();
                } else {
                    // יצירת הזמנה חדשה
                    const res = await fetch(`${SUPABASE_BASE_URL}/court_bookings`, {
                        method: 'POST',
                        headers: apiHeaders,
                        body: JSON.stringify(bookingData)
                    });
                    if (res.ok) fetchBookings();
                }
            } catch (err) {}
        }

        async function addParticipantPrompt(bookingId) {
            const name = prompt("הכנס את שמך להרשמה למשחק:");
            if (!name || !name.trim()) return;

            try {
                const res = await fetch(`${SUPABASE_BASE_URL}/booking_participants`, {
                    method: 'POST',
                    headers: apiHeaders,
                    body: JSON.stringify({ booking_id: bookingId, participant_name: name.trim() })
                });
                if (res.ok) fetchBookings();
            } catch (e) {}
        }

        async function deleteBooking(id) {
            if (!confirm("בטוח שברצונך למחוק הזמנה זו?")) return;
            try {
                await fetch(`${SUPABASE_BASE_URL}/court_bookings?id=eq.${id}`, { method: 'DELETE', headers: apiHeaders });
                fetchBookings();
            } catch (e) {}
        }
    </script>
</body>
</html>
