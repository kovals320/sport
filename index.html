<body class="text-slate-800 pb-12">

    <div class="max-w-xl mx-auto px-4 py-6 space-y-6">

        <!-- Header -->
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold text-slate-900 flex items-center justify-center gap-2">
                <span>🏟️</span> מגרשי ספורט ניר אליהו
            </h1>
            <p class="text-xs text-slate-500">בחרו יום ולחצו "צור הזמנה" להזמנת מגרש</p>

            <!-- מקרא -->
            <div class="flex items-center justify-center gap-4 text-xs pt-1">
                <span class="flex items-center gap-1.5">
                    <span class="w-3 h-3 rounded-full bg-blue-500 inline-block"></span>
                    טניס 🎾
                </span>
                <span class="flex items-center gap-1.5">
                    <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
                    קטרגל ⚽
                </span>
            </div>
        </div>

        <!-- לוח שנה -->
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200/80 space-y-4">

            <!-- מעבר חודשים -->
            <div class="flex items-center justify-between px-2">
                <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 rounded-full transition-colors text-slate-600">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="m9 18 6-6-6-6"/></svg>
                </button>
                <h2 id="calendar-month-title" class="text-lg font-bold text-slate-800">-- 2026</h2>
                <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-100 rounded-full transition-colors text-slate-600">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="m15 18-6-6 6-6"/></svg>
                </button>
            </div>

            <!-- ימי השבוע -->
            <div class="grid grid-cols-7 text-center text-xs font-semibold text-slate-400 py-1">
                <div>א'</div><div>ב'</div><div>ג'</div><div>ד'</div><div>ה'</div><div>ו'</div><div>ש'</div>
            </div>

            <!-- גריד הימים -->
            <div id="calendar-days-grid" class="grid grid-cols-7 gap-2"></div>
        </div>

        <!-- אזור הזמנות ליום שנבחר -->
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200/80 space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 id="selected-day-title" class="text-base font-bold text-slate-800">היום</h3>
            </div>

            <div id="bookings-list" class="space-y-3">
                <div class="text-center py-6 text-slate-400 text-sm">טוען הזמנות...</div>
            </div>

            <button onclick="openBookingModal()" class="w-full bg-amber-500 hover:bg-amber-600 active:scale-[0.98] text-white py-3.5 rounded-2xl font-bold text-base shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                צור הזמנה
            </button>
        </div>

    </div>

    <!-- Modal הזמנה (יצירה / עריכה) -->
    <div id="booking-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-5 relative animate-in fade-in zoom-in-95 duration-150">

            <button onclick="closeBookingModal()" class="absolute top-5 left-5 text-slate-400 hover:text-slate-600">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>

            <h3 id="modal-date-title" class="text-lg font-bold text-slate-900 pr-2">הזמנת מגרש</h3>

            <form onsubmit="submitBooking(event)" class="space-y-4">

                <input type="hidden" id="editing-booking-id" value="">

                <!-- בחירת סוג מגרש -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-2">סוג מגרש</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" id="btn-court-tennis" onclick="selectCourt('tennis')"
                            class="py-3 px-4 rounded-2xl border-2 font-bold text-sm flex items-center justify-center gap-2 transition-all border-blue-500 bg-blue-50 text-blue-700">
                            <span>🎾</span> טניס
                        </button>
                        <button type="button" id="btn-court-futsal" onclick="selectCourt('futsal')"
                            class="py-3 px-4 rounded-2xl border-2 font-bold text-sm flex items-center justify-center gap-2 transition-all border-slate-200 bg-slate-50 text-slate-600">
                            <span>⚽</span> קטרגל
                        </button>
                    </div>
                </div>

                <!-- שעת התחלה ומשך זמן -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">שעת התחלה</label>
                        <select id="booking-start-time" class="w-full px-4 py-3 rounded-2xl border border-slate-200 text-sm font-medium bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">משך זמן</label>
                        <select id="booking-duration" class="w-full px-4 py-3 rounded-2xl border border-slate-200 text-sm font-medium bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="30">חצי שעה</option>
                            <option value="60" selected>שעה</option>
                            <option value="90">שעה וחצי</option>
                            <option value="120">שעתיים</option>
                        </select>
                    </div>
                </div>

                <!-- שם המזמין -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">שם המזמין</label>
                    <input type="text" id="booking-booker-name" placeholder="הכניסו את שמכם" required
                        class="w-full px-4 py-3 rounded-2xl border border-slate-200 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- כולל הרשמת משתתפים -->
                <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-3.5 space-y-3">
                    <div class="flex items-center justify-between">
                        <span class="text-sm font-medium text-slate-700 flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 text-slate-500"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                            כולל הרשמת משתתפים
                        </span>
                        <input type="checkbox" id="booking-enable-reg" onchange="toggleMaxParticipantsInput()" class="w-5 h-5 rounded border-slate-300 text-amber-500 focus:ring-amber-500 cursor-pointer">
                    </div>

                    <!-- שדה מספר מקומות להרשמה -->
                    <div id="max-participants-container" class="hidden pt-2 border-t border-slate-200/60 space-y-1">
                        <label class="block text-xs font-semibold text-slate-600">מספר מקומות להרשמה</label>
                        <input type="number" id="booking-max-participants" min="1" max="30" value="10"
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm bg-white text-center font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                </div>

                <button type="submit" id="modal-submit-btn" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-amber-500/20 transition-all text-base">
                    אישור הזמנה
                </button>
            </form>
        </div>
    </div>

    <!-- Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
      }
    </script>

    <!-- Logic -->
    <script>
        const SUPABASE_BASE_URL = 'https://pjujibzoscawmstarerz.supabase.co/rest/v1';
        const SUPABASE_KEY = 'sb_publishable_5mK3Md5VCpXjHTSgVv68GQ_8kmPbg83';

        // שמות הטבלאות ב-Supabase
        const TABLE_BOOKINGS = 'sport_court_bookings';
        const TABLE_PARTICIPANTS = 'sport_booking_participants';

        // רק העמודות שהאפליקציה באמת משתמשת בהן
        const BOOKING_COLS = 'id,date,court_type,start_time,duration_minutes,booker_name,enable_registration,max_participants';
        const PARTICIPANT_COLS = 'booking_id,participant_name';

        const apiHeaders = {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
        };

        const monthNames = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני", "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"];
        const dayNames = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"];

        // אייקונים מוטמעים (במקום לטעון את כל ספריית Lucide)
        const ICONS = {
            'pencil': '<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>',
            'trash-2': '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>'
        };
        const icon = (name, cls) => `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls}">${ICONS[name]}</svg>`;

        const pad = n => String(n).padStart(2, '0');
        const toDateKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        const monthKeyOf = dateStr => dateStr.slice(0, 7);

        const today = new Date();
        let currentDate = new Date(today.getFullYear(), today.getMonth(), 1);
        let selectedDateStr = toDateKey(today); // תאריך מקומי (ישראל), לא UTC
        let selectedCourtType = 'tennis';

        // הזמנות לפי חודש: 'YYYY-MM' -> [...]
        const bookingsByMonth = new Map();
        let allParticipants = [];

        const viewedMonthKey = () => `${currentDate.getFullYear()}-${pad(currentDate.getMonth() + 1)}`;
        const bookingsForMonth = key => bookingsByMonth.get(key) || [];

        document.addEventListener('DOMContentLoaded', () => {
            populateTimeOptions();
            renderCalendar();
            refresh().then(prefetchNeighbors);
        });

        function populateTimeOptions() {
            let html = '';
            for (let h = 6; h <= 22; h++) {
                for (let m = 0; m < 60; m += 30) {
                    if (h === 22 && m > 0) break;
                    const timeStr = `${pad(h)}:${pad(m)}`;
                    html += `<option value="${timeStr}">${timeStr}</option>`;
                }
            }
            document.getElementById('booking-start-time').innerHTML = html;
        }

        function toggleMaxParticipantsInput() {
            const enabled = document.getElementById('booking-enable-reg').checked;
            document.getElementById('max-participants-container').classList.toggle('hidden', !enabled);
        }

        // טוען הזמנות של חודש אחד בלבד
        async function fetchMonth(key) {
            const [y, m] = key.split('-').map(Number);
            const next = m === 12 ? `${y + 1}-01` : `${y}-${pad(m + 1)}`;
            const url = `${SUPABASE_BASE_URL}/${TABLE_BOOKINGS}?select=${BOOKING_COLS}&date=gte.${key}-01&date=lt.${next}-01`;
            const res = await fetch(url, { headers: apiHeaders });
            if (res.ok) bookingsByMonth.set(key, await res.json());
        }

        async function fetchParticipants() {
            const res = await fetch(`${SUPABASE_BASE_URL}/${TABLE_PARTICIPANTS}?select=${PARTICIPANT_COLS}`, { headers: apiHeaders });
            if (res.ok) allParticipants = await res.json();
        }

        // מרענן במקביל את החודש המוצג, את החודש של היום הנבחר (אם שונה) ואת המשתתפים
        async function refresh() {
            const key = viewedMonthKey();
            const months = new Set([key, monthKeyOf(selectedDateStr)]);
            try {
                await Promise.all([...[...months].map(fetchMonth), fetchParticipants()]);
            } catch (e) {}

            if (key === viewedMonthKey()) renderCalendar();
            renderSelectedDayBookings();
        }

        // טעינה מוקדמת של החודש הקודם והבא, כדי שהמעבר ביניהם יהיה מיידי
        function prefetchNeighbors() {
            const y = currentDate.getFullYear(), m = currentDate.getMonth();
            [new Date(y, m - 1, 1), new Date(y, m + 1, 1)].forEach(d => {
                const key = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
                if (!bookingsByMonth.has(key)) fetchMonth(key).catch(() => {});
            });
        }

        function changeMonth(delta) {
            currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + delta, 1);
            const key = viewedMonthKey();
            renderCalendar(); // מציג מיד מהמטמון (אם קיים)

            // ומרענן ברקע כדי לקבל שינויים של משתמשים אחרים
            fetchMonth(key).then(() => {
                if (key === viewedMonthKey()) renderCalendar();
                prefetchNeighbors();
            }).catch(() => {});
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('calendar-month-title').textContent = `${monthNames[month]} ${year}`;

            const firstDayOfMonth = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const monthBookings = bookingsForMonth(`${year}-${pad(month + 1)}`);
            const todayKey = toDateKey(new Date());

            // סיכום לכל יום במעבר אחד על ההזמנות
            const byDay = {};
            for (const b of monthBookings) {
                const d = byDay[b.date] || (byDay[b.date] = { count: 0, tennis: false, futsal: false });
                d.count++;
                if (b.court_type === 'tennis') d.tennis = true;
                else if (b.court_type === 'futsal') d.futsal = true;
            }

            let html = '<div></div>'.repeat(firstDayOfMonth);

            for (let day = 1; day <= daysInMonth; day++) {
                const dateKey = `${year}-${pad(month + 1)}-${pad(day)}`;
                const info = byDay[dateKey];

                let bgClass = 'bg-slate-100 text-slate-700';
                if (info && info.tennis && info.futsal) bgClass = 'court-bg-both text-white';
                else if (info && info.tennis) bgClass = 'bg-blue-500 text-white';
                else if (info && info.futsal) bgClass = 'bg-emerald-500 text-white';

                const isSelected = dateKey === selectedDateStr ? 'ring-4 ring-blue-600/30 font-bold scale-105' : '';
                // ימים שעברו מוצגים דהויים (אלא אם נבחרו)
                const isPast = dateKey < todayKey && !isSelected ? 'opacity-50' : '';

                html += `
                    <button onclick="selectDate('${dateKey}')"
                        class="h-11 rounded-2xl text-sm font-semibold flex flex-col items-center justify-center transition-all ${bgClass} ${isSelected} ${isPast}">
                        <span>${day}</span>
                        ${info ? `<span class="text-[9px] opacity-80 font-normal">≡</span>` : ''}
                    </button>
                `;
            }

            document.getElementById('calendar-days-grid').innerHTML = html;
        }

        function selectDate(dateKey) {
            selectedDateStr = dateKey;
            renderCalendar();
            renderSelectedDayBookings();
        }

        function renderSelectedDayBookings() {
            const d = new Date(selectedDateStr + 'T00:00:00');
            document.getElementById('selected-day-title').textContent = `היום יום ${dayNames[d.getDay()]} ${d.getDate()}/${d.getMonth() + 1}`;

            const listEl = document.getElementById('bookings-list');
            const dayBookings = bookingsForMonth(monthKeyOf(selectedDateStr))
                .filter(b => b.date === selectedDateStr)
                .sort((a, b) => a.start_time.localeCompare(b.start_time));

            if (dayBookings.length === 0) {
                listEl.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">אין הזמנות ליום זה</div>`;
                return;
            }

            listEl.innerHTML = dayBookings.map(b => {
                const parts = allParticipants.filter(p => p.booking_id === b.id);

                const [h, m] = b.start_time.split(':').map(Number);
                const endD = new Date(2000, 0, 1, h, m + b.duration_minutes);
                const endTimeStr = `${pad(endD.getHours())}:${pad(endD.getMinutes())}`;

                const badgeBg = b.court_type === 'tennis' ? 'bg-blue-600' : 'bg-emerald-600';
                const maxParts = b.max_participants || 10;
                const isFull = parts.length >= maxParts;

                return `
                    <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-4 space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-sm font-bold text-slate-800">${b.booker_name}</span>
                            <span class="${badgeBg} text-white px-3 py-1 rounded-xl text-xs font-bold shadow-sm">
                                ${b.start_time} – ${endTimeStr}
                            </span>
                        </div>

                        <div class="flex items-center justify-between pt-1">
                            <div>
                                ${b.enable_registration ? `
                                    <div class="flex items-center gap-2">
                                        <button onclick="addParticipantPrompt(${b.id}, ${maxParts},${parts.length})"
                                            class="${isFull ? 'bg-slate-300 cursor-not-allowed' : 'bg-amber-500 hover:bg-amber-600'} text-white text-xs font-bold px-3 py-1.5 rounded-xl shadow-sm transition-all"
                                            ${isFull ? 'disabled' : ''}>
                                            ${isFull ? 'מלא' : 'הרשמה'}
                                        </button>
                                        <span class="text-xs font-semibold text-amber-700 bg-amber-50 border border-amber-200 px-2.5 py-1 rounded-xl">
                                            🎟️ כולל הרשמה ${parts.length}/${maxParts}
                                        </span>
                                    </div>
                                ` : ''}
                            </div>

                            <div class="flex items-center gap-1.5 text-slate-400">
                                <button onclick="editBooking(${b.id})" class="p-1.5 hover:bg-slate-200/60 rounded-xl transition-colors text-slate-500" title="ערוך הזמנה">
                                    ${icon('pencil', 'w-4 h-4')}
                                </button>
                                <button onclick="deleteBooking(${b.id})" class="p-1.5 hover:bg-red-100 rounded-xl transition-colors text-red-500" title="מחק הזמנה">
                                    ${icon('trash-2', 'w-4 h-4')}
                                </button>
                            </div>
                        </div>

                        ${b.enable_registration && parts.length > 0 ? `
                            <div class="flex flex-wrap gap-1.5 pt-1">
                                ${parts.map(p => `
                                    <span class="bg-white border border-slate-200 text-slate-600 text-xs px-2.5 py-0.5 rounded-lg">
                                        ${p.participant_name}
                                    </span>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function selectCourt(type) {
            selectedCourtType = type;
            const btnTennis = document.getElementById('btn-court-tennis');
            const btnFutsal = document.getElementById('btn-court-futsal');

            if (type === 'tennis') {
                btnTennis.className = "py-3 px-4 rounded-2xl border-2 font-bold text-sm flex items-center justify-center gap-2 transition-all border-blue-500 bg-blue-50 text-blue-700";
                btnFutsal.className = "py-3 px-4 rounded-2xl border-2 font-bold text-sm flex items-center justify-center gap-2 transition-all border-slate-200 bg-slate-50 text-slate-600";
            } else {
                btnFutsal.className = "py-3 px-4 rounded-2xl border-2 font-bold text-sm flex items-center justify-center gap-2 transition-all border-emerald-500 bg-emerald-50 text-emerald-700";
                btnTennis.className = "py-3 px-4 rounded-2xl border-2 font-bold text-sm flex items-center justify-center gap-2 transition-all border-slate-200 bg-slate-50 text-slate-600";
            }
        }

        function openBookingModal() {
            document.getElementById('editing-booking-id').value = '';
            document.getElementById('booking-booker-name').value = '';
            document.getElementById('booking-enable-reg').checked = false;
            document.getElementById('booking-max-participants').value = '10';
            toggleMaxParticipantsInput();

            document.getElementById('booking-start-time').selectedIndex = 0;
            document.getElementById('booking-duration').value = '60';
            selectCourt('tennis');

            document.getElementById('modal-submit-btn').textContent = 'אישור הזמנה';

            const d = new Date(selectedDateStr + 'T00:00:00');
            document.getElementById('modal-date-title').textContent = `הזמנת מגרש — יום ${dayNames[d.getDay()]}, ${d.getDate()} ב${monthNames[d.getMonth()]}`;
            document.getElementById('booking-modal').classList.remove('hidden');
        }

        function editBooking(id) {
            const b = bookingsForMonth(monthKeyOf(selectedDateStr)).find(item => item.id === id);
            if (!b) return;

            document.getElementById('editing-booking-id').value = b.id;
            document.getElementById('booking-booker-name').value = b.booker_name;
            document.getElementById('booking-start-time').value = b.start_time;
            document.getElementById('booking-duration').value = b.duration_minutes.toString();
            document.getElementById('booking-enable-reg').checked = b.enable_registration;
            document.getElementById('booking-max-participants').value = b.max_participants || 10;
            toggleMaxParticipantsInput();

            selectCourt(b.court_type);

            document.getElementById('modal-submit-btn').textContent = 'עדכון הזמנה';

            const d = new Date(selectedDateStr + 'T00:00:00');
            document.getElementById('modal-date-title').textContent = `עריכת הזמנה — יום ${dayNames[d.getDay()]}, ${d.getDate()} ב${monthNames[d.getMonth()]}`;
            document.getElementById('booking-modal').classList.remove('hidden');
        }

        function closeBookingModal() {
            document.getElementById('booking-modal').classList.add('hidden');
        }

        async function submitBooking(e) {
            e.preventDefault();
            const bookingId = document.getElementById('editing-booking-id').value;
            const startTime = document.getElementById('booking-start-time').value;
            const duration = parseInt(document.getElementById('booking-duration').value);
            const bookerName = document.getElementById('booking-booker-name').value.trim();
            const enableReg = document.getElementById('booking-enable-reg').checked;
            const maxParticipants = enableReg ? (parseInt(document.getElementById('booking-max-participants').value) || 10) : 6;

            if (!bookerName) return;

            const bookingData = {
                date: selectedDateStr,
                court_type: selectedCourtType,
                start_time: startTime,
                duration_minutes: duration,
                booker_name: bookerName,
                enable_registration: enableReg,
                max_participants: maxParticipants
            };

            closeBookingModal();

            try {
                const res = bookingId
                    ? await fetch(`${SUPABASE_BASE_URL}/${TABLE_BOOKINGS}?id=eq.${bookingId}`, { method: 'PATCH', headers: apiHeaders, body: JSON.stringify(bookingData) })
                    : await fetch(`${SUPABASE_BASE_URL}/${TABLE_BOOKINGS}`, { method: 'POST', headers: apiHeaders, body: JSON.stringify(bookingData) });
                if (res.ok) refresh();
            } catch (err) {}
        }

        async function addParticipantPrompt(bookingId, maxParts, currentCount) {
            if (currentCount >= maxParts) {
                alert("ההרשמה מלאה למשחק זה!");
                return;
            }

            const name = prompt("הכנס את שמך להרשמה למשחק:");
            if (!name || !name.trim()) return;

            try {
                const res = await fetch(`${SUPABASE_BASE_URL}/${TABLE_PARTICIPANTS}`, {
                    method: 'POST',
                    headers: apiHeaders,
                    body: JSON.stringify({ booking_id: bookingId, participant_name: name.trim() })
                });
                if (res.ok) refresh();
            } catch (e) {}
        }

        async function deleteBooking(id) {
            if (!confirm("בטוח שברצונך למחוק הזמנה זו?")) return;
            try {
                await fetch(`${SUPABASE_BASE_URL}/${TABLE_BOOKINGS}?id=eq.${id}`, { method: 'DELETE', headers: apiHeaders });
                refresh();
            } catch (e) {}
        }
    </script>
</body>
</html>
